shellEmulator: true

trustPolicy: no-downgrade

# semver@6.3.1 trips no-downgrade because the 6.x line predates npm trusted
# publishing: 7.x ships SLSA provenance, 6.3.1 only has a registry signature,
# so the same name resolves at two trust levels. 6.3.1 is the legitimate
# CVE-2022-25883 (ReDoS) fix, published 2023-07-10 by npm CLI maintainer
# lukekarrys. It reaches us via @babel/core (^6.3.1) <- @vitejs/plugin-vue-jsx
# <- nuxt. Pinned to the exact version so any future 6.x re-triggers the check.
trustPolicyExclude:
  - semver@6.3.1

# Not a monorepo — this declares the root only so the file parses on pnpm 8/9,
# which reject a settings-only pnpm-workspace.yaml with "packages field missing
# or empty". Cloudflare Workers Builds ran such a version before
# package.json#packageManager pinned it. Verified not to change the lockfile.
packages:
  - .

allowBuilds:
  core-js: false
  esbuild: false
  vue-demi: false
  workerd: false
